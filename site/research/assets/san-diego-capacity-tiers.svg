<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080" role="img" aria-label="SAN DIEGO, CALIFORNIA ordinance evidence card"><rect width="1080" height="1080" fill="#F7F5ED"/><rect x="0" y="0" width="1080" height="22" fill="#174D41"/><text x="65" y="102" fill="#317360" font-family="Arial,sans-serif" font-weight="bold" letter-spacing="5" font-size="25">SAN DIEGO, CALIFORNIA</text><text x="65" y="177" fill="#173D33" font-family="Georgia,serif" font-size="61">The coop's location</text><text x="65" y="246" fill="#173D33" font-family="Georgia,serif" font-size="61">changes the flock limit.</text><text x="65" y="316" fill="#59786D" font-family="Arial,sans-serif" font-size="25">Municipal code §42.0709(e) · residential properties</text><g transform="translate(66 365)"><rect width="948" height="111" rx="18" fill="#F7F5ED"/><text x="28" y="79" fill="#194D43" font-family="Georgia, serif" font-size="74">05</text><text x="180" y="65" font-size="30" font-family="Arial, sans-serif" fill="#233C34">Outside required setbacks</text></g><g transform="translate(66 495)"><rect width="948" height="111" rx="18" fill="#E9F1EA"/><text x="28" y="79" fill="#194D43" font-family="Georgia, serif" font-size="74">15</text><text x="180" y="65" font-size="30" font-family="Arial, sans-serif" fill="#233C34">≥15 ft from lot lines &amp; outside setbacks</text></g><g transform="translate(66 625)"><rect width="948" height="111" rx="18" fill="#F7F5ED"/><text x="28" y="79" fill="#194D43" font-family="Georgia, serif" font-size="74">25</text><text x="180" y="65" font-size="30" font-family="Arial, sans-serif" fill="#233C34">≥50 ft from residential buildings</text></g><line x1="65" y1="795" x2="1015" y2="795" stroke="#CAD9CC" stroke-width="2"/><foreignObject x="65" y="819" width="940" height="100"><div xmlns="http://www.w3.org/1999/xhtml" style="font:26px/1.3 Arial,sans-serif;color:#315E52">Numbers shown are conditional limits, not a blanket approval. Roosters are prohibited.</div></foreignObject><text x="65" y="977" fill="#375F50" font-family="Arial,sans-serif" font-size="21">sandiego.gov/urban-farming/bees-and-livestock/chickens</text><text x="65" y="1024" fill="#173D33" font-family="Arial,sans-serif" font-size="22" font-weight="bold">COOPCHECK  /  RESEARCH 2026</text><text x="1013" y="1024" text-anchor="end" font-size="20" fill="#66857A" font-family="Arial,sans-serif">1 / 3  • 1</text></svg>