name: CoopCheck — Remastered Shorts V2
on:
  push:
    paths:
      - ".github/workflows/coopcheck-remaster-v2.yml"
      - "scripts/marketing/remaster_v2.py"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  remaster:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download original genuine site recording
        uses: actions/download-artifact@v4
        with:
          name: CoopCheck-Shorts-01
          run-id: 39210106095
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input-video
      - name: Download new neural narration
        uses: actions/download-artifact@v4
        with:
          name: CoopCheck-Shorts-Natural-Voice-V2
          run-id: 39212781157
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: input-voice
      - name: Install render dependencies
        run: |
          python -m pip install Pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Build remastered Shorts video and cover
        run: python scripts/marketing/remaster_v2.py
      - name: Validate video and narration
        run: |
          test -s marketing-v2/coopcheck_short_01_v2.mp4
          ffprobe -v error -show_entries stream=codec_type,codec_name,width,height:format=duration -of default=noprint_wrappers=1 marketing-v2/coopcheck_short_01_v2.mp4
      - name: Make finished video available for remote YouTube Studio upload
        uses: actions/upload-artifact@v4
        with:
          name: CoopCheck-Shorts-V2-Ready-To-Upload
          path: |
            marketing-v2/coopcheck_short_01_v2.mp4
            marketing-v2/cover_v2.jpg
          compression-level: 0
          retention-days: 30
