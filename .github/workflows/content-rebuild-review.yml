name: Content rebuild review
on:
  push:
    branches: ['content/value-rebuild-20261105']
    paths: ['scripts/**', 'site/data/editorial-*.json', '.github/workflows/content-rebuild-review.yml']
permissions:
  contents: write
concurrency:
  group: content-rebuild-review
  cancel-in-progress: false
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild reviewed content when implementation is present
        run: |
          if [ -f scripts/rebuild-editorial.cjs ]; then
            node scripts/rebuild-editorial.cjs
          fi
      - name: Verify generated files and existing regressions
        run: |
          node scripts/generate-policy-data.cjs --check
          node scripts/generate-coverage-pages.cjs --check
          node scripts/generate-coop-seo-pages.cjs --check
          node scripts/generate-coop-intent-tools.cjs --check
          for test in scripts/qa-*.cjs; do
            echo "RUN $test"
            node "$test"
          done
      - name: Save generated source changes on this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site scripts audits docs/operations
          if ! git diff --cached --quiet; then
            git commit -m 'content: generate and verify evidence-led decision pages'
            git push origin HEAD:content/value-rebuild-20261105
          fi
      - name: Package review snapshot
        if: always()
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/coopcheck-content-review.tar.gz .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coopcheck-content-review
          path: /tmp/coopcheck-content-review.tar.gz
          retention-days: 7
