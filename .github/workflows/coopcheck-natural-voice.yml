name: CoopCheck — Natural Shorts Voice V2
on:
  push:
    paths:
      - ".github/workflows/coopcheck-natural-voice.yml"
      - "scripts/marketing/natural_voice_v2.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install neural speech engine (no robotic fallback)
        run: |
          python -m pip install -U pip
          python -m pip install kokoro-onnx soundfile numpy
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng
      - name: Generate narrated track
        run: python scripts/marketing/natural_voice_v2.py
      - name: Validate audio
        run: |
          test -s marketing-output/voice_natural_v2.wav
          file marketing-output/voice_natural_v2.wav
          ls -lh marketing-output/voice_natural_v2.wav
      - uses: actions/upload-artifact@v4
        with:
          name: CoopCheck-Shorts-Natural-Voice-V2
          path: marketing-output/voice_natural_v2.wav
          retention-days: 30
          compression-level: 0
