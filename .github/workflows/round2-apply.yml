name: Round2 source-backed content rebuild
on:
  push:
    branches:
      - content/source-depth-20261105
permissions:
  contents: write
concurrency:
  group: coopcheck-source-depth-20261105
  cancel-in-progress: false
jobs:
  source-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify transferred source revision and unpack
        run: |
          cat tmp_round2/p0*.txt | tr -d '\n' | base64 -d > /tmp/round2_upload.tgz
          echo '1a4090e332964d2dbf94851f4553085fcd05bb590a4fc67e49a47b620f7e221e  /tmp/round2_upload.tgz' | sha256sum -c -
          tar xzf /tmp/round2_upload.tgz
          git apply round2.patch
          rm round2.patch
      - name: Regenerate and run all content and product QA
        run: |
          node scripts/rebuild-editorial.cjs
          node scripts/generate-policy-data.cjs --check
          node scripts/generate-coverage-pages.cjs --check
          node scripts/generate-coop-seo-pages.cjs --check
          node scripts/generate-coop-intent-tools.cjs --check
          for f in scripts/qa-*.cjs; do
            echo "RUN $f"
            node "$f"
          done
          git diff --check
      - name: Commit tested source and published HTML without transfer scaffolding
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts site
          git rm -r -f tmp_round2
          git rm -f .github/workflows/round2-apply.yml
          git commit -m 'content: add product evidence and local city decision cases'
          git push origin HEAD:content/source-depth-20261105
