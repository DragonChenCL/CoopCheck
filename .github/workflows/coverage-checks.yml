name: Validate CoopCheck policy coverage

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check canonical policy registry
        run: node scripts/generate-policy-data.cjs --check
      - name: Check generated city pages, coverage and sitemap
        run: node scripts/generate-coverage-pages.cjs --check
      - name: Verify source-backed setback guide and free spacing worksheet
        run: node scripts/qa-setback-guide.cjs
      - name: Verify local-only chicken coop plan generator and diagram geometry
        run: node scripts/qa-coop-plan.cjs

      - name: Verify field-specific evidence status
        run: node scripts/qa-policy-evidence.cjs
      - name: Protect current Garland and Olympia ordinance details
        run: node scripts/qa-recent-city-ordinances.cjs

      - name: Validate city search and directory
        run: node scripts/qa-city-search.cjs
      - name: Run policy / planner / payment regressions
        run: |
          node scripts/qa-coopcheck.cjs
          node scripts/qa-coop-payment.cjs
