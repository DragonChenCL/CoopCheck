name: Browser smoke test - coop plan generator

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/e2e-coop-plan.cjs"
      - ".github/workflows/coop-plan-browser-test.yml"
      - "site/coop-plan.html"
      - "site/assets/coop-plan.js"
      - "site/assets/coop-plan.css"
      - "site/assets/project.js"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install isolated real browser tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium
      - name: Exercise full UI in Chromium
        run: node scripts/e2e-coop-plan.cjs
      - name: Keep desktop/mobile screenshots and print PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coop-plan-e2e-artifacts
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
