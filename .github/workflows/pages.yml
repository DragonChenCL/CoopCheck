name: Deploy CoopCheck to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify policy registry is generated and in sync
        run: node scripts/generate-policy-data.cjs --check

      - name: Verify generated city coverage and sitemap
        run: node scripts/generate-coverage-pages.cjs --check

      - name: Enforce field-specific municipal code evidence review
        run: node scripts/qa-policy-evidence.cjs

      - name: Verify city search and directory
        run: node scripts/qa-city-search.cjs

      - name: Verify source-backed setback guide and free spacing worksheet
        run: node scripts/qa-setback-guide.cjs
      - name: Verify indexable coop sizing guides are up to date
        run: node scripts/generate-coop-seo-pages.cjs --check
      - name: Verify ten SEO utility pages and real calculator
        run: node scripts/qa-coop-seo.cjs
      - name: Verify evidence-backed prefab coop buyer checker
        run: node scripts/qa-prefab-coop-buyer.cjs
      - name: Verify printable chicken permit checklist and government source scope
        run: node scripts/qa-permit-worksheet.cjs
      - name: Guard every sitemap URL canonical and indexability
        run: node scripts/qa-sitemap-indexability.cjs
      - name: Verify six task-specific search intent landing tools in sync
        run: node scripts/generate-coop-intent-tools.cjs --check
      - name: Verify run, mesh, nesting, roost and cost calculations
        run: node scripts/qa-coop-intent-tools.cjs
      - name: Verify local-only chicken coop plan generator and diagram geometry
        run: node scripts/qa-coop-plan.cjs
      - name: Verify per-city ordinance evidence integration and map handoff
        run: node scripts/qa-plan-law.cjs

      - name: Verify source-backed city benchmark pages
        run: node scripts/qa-benchmark-cities.cjs

      - name: Verify quick flock screening and five-city field evidence
        run: node scripts/qa-quick-check.cjs

      - name: Protect current Garland and Olympia ordinance details
        run: node scripts/qa-recent-city-ordinances.cjs

      - name: Verify planner and payment regression checks
        run: node scripts/qa-coopcheck.cjs

      - name: Verify mocked payment flow without charge
        run: node scripts/qa-coop-payment.cjs

      - name: Build runtime config
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          node -e "require('fs').writeFileSync('site/assets/runtime-config.js', 'window.COOPCHECK_MAPBOX_TOKEN=' + JSON.stringify(process.env.MAPBOX_TOKEN || '') + ';\n')"

      - name: Inject GA4 into static pages
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = 'site';
          const tag = '<script defer src="/assets/analytics.js"></script>';
          function walk(dir) {
            for (const name of fs.readdirSync(dir)) {
              const p = path.join(dir, name);
              const stat = fs.statSync(p);
              if (stat.isDirectory()) walk(p);
              else if (name.endsWith('.html')) {
                let html = fs.readFileSync(p, 'utf8');
                if (!html.includes('/assets/analytics.js')) {
                  html = html.replace('</head>', tag + '</head>');
                  fs.writeFileSync(p, html);
                }
              }
            }
          }
          walk(root);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
